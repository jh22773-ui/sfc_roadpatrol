name: Android Release

# 정식 배포: v1.0.0 같은 태그를 올리면 고정 키로 서명한 APK를 만들어 최신 릴리스로 올린다.
# 직원용 고정 주소: https://github.com/jh22773-ui/sfc_roadpatrol/releases/latest/download/sfc-roadpatrol.apk
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="${TAG#v}"
          if ! [[ "$NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "태그는 v1.2.3 형식이어야 합니다: $TAG"; exit 1
          fi
          CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "SIGNING_KEYSTORE_BASE64 시크릿이 없습니다."; exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sfc-roadpatrol.p12"

      - name: Build signed APK
        env:
          SIGNING_KEYSTORE_FILE: ${{ runner.temp }}/sfc-roadpatrol.p12
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          gradle -p android assembleRelease --no-daemon \
            -PappVersionName=${{ steps.ver.outputs.name }} \
            -PappVersionCode=${{ steps.ver.outputs.code }}

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep -E "Signer #1 certificate (DN|SHA-256)"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk sfc-roadpatrol.apk
          gh release create "$GITHUB_REF_NAME" sfc-roadpatrol.apk \
            --latest \
            --title "순찰적출입력 ${{ steps.ver.outputs.name }}" \
            --notes "설치: 이 파일을 폰에서 내려받아 실행하세요. 처음 설치 시 '출처를 알 수 없는 앱 설치'를 허용해야 합니다."

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/sfc-roadpatrol.p12"
