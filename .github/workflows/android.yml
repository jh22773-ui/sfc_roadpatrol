name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sfc-roadpatrol-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # 폰에서 바로 받을 수 있도록 고정 주소(releases/download/test/...)의 테스트 릴리스로 올린다.
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk sfc-roadpatrol-test.apk
          gh release delete test --yes --cleanup-tag || true
          gh release create test sfc-roadpatrol-test.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "테스트 빌드 #${{ github.run_number }}" \
            --notes "현장 테스트용 APK입니다. 정식 배포용이 아닙니다."
