<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>도로 순찰 적출</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 14px; background-color: #f4f6f8; color: #202124; }
    .card { background: #fff; padding: 16px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 14px; }
    h2 { margin: 0 0 14px 0; font-size: 1.2rem; text-align: center; color: #1a73e8; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: 600; font-size: 0.88rem; margin-bottom: 5px; color: #3c4043; }
    input[type="text"], select, textarea { width: 100%; padding: 10px; border: 1px solid #dadce0; border-radius: 8px; font-size: 0.95rem; background: #fff; }
    textarea { height: 70px; resize: none; }
    
    .gps-box { display: flex; align-items: center; justify-content: space-between; background: #e8f0fe; padding: 8px 12px; border-radius: 8px; font-size: 0.82rem; }
    .gps-text { color: #1967d2; font-weight: 600; }
    .btn-gps { background: #fff; border: 1px solid #1a73e8; color: #1a73e8; padding: 4px 8px; border-radius: 6px; font-size: 0.78rem; cursor: pointer; }
    
    .dir-container { display: flex; gap: 8px; margin-top: 6px; }
    .btn-dir { flex: 1; padding: 12px; font-size: 1rem; font-weight: bold; border: 1px solid #dadce0; border-radius: 8px; background: #f8f9fa; color: #5f6368; cursor: pointer; text-align: center; transition: 0.15s; }
    .btn-dir.active { background: #1a73e8; color: #fff; border-color: #1a73e8; box-shadow: 0 2px 4px rgba(26,115,232,0.3); }

    .camera-btn { display: block; width: 100%; text-align: center; background: #0f9d58; color: white; padding: 11px; border-radius: 8px; font-weight: bold; font-size: 0.95rem; cursor: pointer; }
    #cameraInput { display: none; }
    #preview { width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; margin-top: 8px; display: none; }
    
    .submit-btn { width: 100%; background: #1a73e8; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1.05rem; font-weight: bold; cursor: pointer; margin-top: 6px; }
    .submit-btn:disabled { background: #bdc1c6; }
    #loading { display: none; text-align: center; font-weight: bold; color: #d93025; margin-top: 10px; font-size: 0.9rem; }
  </style>
</head>
<body>

<div class="card">
  <h2>도로 순찰 적출 등록</h2>

  <div class="form-group">
    <label for="reporter">보고자</label>
    <input type="text" id="reporter" placeholder="이름 입력" onchange="saveReporter(this.value)">
  </div>

  <div class="form-group">
    <label for="roadSelect">노선명</label>
    <select id="roadSelect" onchange="onRoadChange()">
      <option value="">-- 노선을 선택하세요 --</option>
      <option value="올림픽대로">올림픽대로</option>
      <option value="동부간선도로">동부간선도로</option>
      <option value="강변북로">강변북로</option>
      <option value="내부순환도로">내부순환도로</option>
      <option value="고속국도1호">고속국도1호</option>
      <option value="북부간선도로">북부간선도로</option>
      <option value="국회대로">국회대로</option>
      <option value="언주로">언주로</option>
      <option value="서부간선도로">서부간선도로</option>
      <option value="강남순환로">강남순환로</option>
      <option value="우면산로">우면산로</option>
    </select>
  </div>

  <div class="form-group" id="dirGroup" style="display: none;">
    <label>진행 방향</label>
    <div class="dir-container" id="dirContainer"></div>
  </div>

  <div class="form-group">
    <label for="detailLocation">상세위치</label>
    <input type="text" id="detailLocation" placeholder="예: 3차로 포트홀, OO램프 인근">
  </div>

  <div class="form-group">
    <label>GPS 위치</label>
    <div class="gps-box">
      <span id="gpsStatus" class="gps-text">위치 잡는 중...</span>
      <button type="button" class="btn-gps" onclick="getLocation()">재수신</button>
    </div>
  </div>

  <div class="form-group">
    <label for="description">상태설명</label>
    <textarea id="description" placeholder="손상 상태, 도로 시설물 이상 내용 입력"></textarea>
  </div>

  <div class="form-group">
    <label>현장 사진</label>
    <label for="cameraInput" class="camera-btn">📷 사진 촬영</label>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="processImage(this)">
    <img id="preview" alt="미리보기">
  </div>

  <button type="button" class="submit-btn" id="submitBtn" onclick="submitData()">등록하기</button>
  <div id="loading">데이터 전송 중입니다. 잠시만 기다려주세요...</div>
</div>

<script>
  // 배포된 Apps Script 엔드포인트 URL
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbywk5Nkz6v_smihkOEMeM39atjJXBJzkG8Afz5m9VaiXBmBQ184ixio3Pv_sDFOJmcm/exec";

  const ROAD_DIRECTIONS = {
    "올림픽대로": ["공항", "강일"],
    "동부간선도로": ["의정부", "성수"],
    "강변북로": ["난지", "구리"],
    "내부순환도로": ["성산", "성수"],
    "고속국도1호": ["서울", "부산"],
    "북부간선도로": ["월곡", "신내"],
    "국회대로": ["목동", "인천"],
    "언주로": ["포이", "내곡"],
    "서부간선도로": ["성산", "시흥"],
    "강남순환로": ["광명", "수서"],
    "우면산로": ["반포", "과천"]
  };

  let selectedDirection = "";
  let currentLat = null;
  let currentLng = null;
  let compressedBase64 = null;

  window.onload = function() {
    const savedName = localStorage.getItem('reporterName');
    if (savedName) document.getElementById('reporter').value = savedName;
    getLocation();
  };

  function saveReporter(name) {
    localStorage.setItem('reporterName', name);
  }

  function onRoadChange() {
    const road = document.getElementById('roadSelect').value;
    const dirGroup = document.getElementById('dirGroup');
    const container = document.getElementById('dirContainer');
    
    selectedDirection = "";
    container.innerHTML = "";

    if (!road || !ROAD_DIRECTIONS[road]) {
      dirGroup.style.display = "none";
      return;
    }

    ROAD_DIRECTIONS[road].forEach(dir => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn-dir';
      btn.innerText = `${dir} 방향`;
      btn.onclick = function() {
        document.querySelectorAll('.btn-dir').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedDirection = dir;
      };
      container.appendChild(btn);
    });

    dirGroup.style.display = "block";
  }

  function getLocation() {
    const statusText = document.getElementById('gpsStatus');
    statusText.innerText = "위치 갱신 중...";
    if (!navigator.geolocation) {
      statusText.innerText = "GPS 미지원";
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        currentLat = pos.coords.latitude.toFixed(6);
        currentLng = pos.coords.longitude.toFixed(6);
        statusText.innerText = `수신완료 (${currentLat}, ${currentLng})`;
      },
      (err) => {
        statusText.innerText = "GPS 수신 실패 (권한 허용 확인)";
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  }

  function processImage(input) {
    if (input.files && input.files[0]) {
      const file = input.files[0];
      const reader = new FileReader();

      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 1200;
          let width = img.width;
          let height = img.height;

          if (width > height && width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          compressedBase64 = canvas.toDataURL('image/jpeg', 0.75);

          const preview = document.getElementById('preview');
          preview.src = compressedBase64;
          preview.style.display = 'block';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
  }

  // fetch API를 통한 비동기 전송
  async function submitData() {
    const reporter = document.getElementById('reporter').value.trim();
    const road = document.getElementById('roadSelect').value;
    const detail = document.getElementById('detailLocation').value.trim();
    const desc = document.getElementById('description').value.trim();
    const submitBtn = document.getElementById('submitBtn');
    const loading = document.getElementById('loading');

    if (!road) {
      alert("노선명을 선택해주세요.");
      return;
    }
    if (!selectedDirection) {
      alert("방향을 선택해주세요.");
      return;
    }

    submitBtn.disabled = true;
    loading.style.display = 'block';

    const payload = {
      reporter: reporter,
      roadName: road,
      direction: selectedDirection,
      detailLocation: detail,
      latitude: currentLat,
      longitude: currentLng,
      description: desc,
      imageBase64: compressedBase64
    };

    try {
      // CORS Preflight(OPTIONS) 방지를 위해 text/plain 스트림으로 전송
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (result.status === "success") {
        alert("적출 내역이 성공적으로 등록되었습니다.");
        document.getElementById('detailLocation').value = '';
        document.getElementById('description').value = '';
        document.getElementById('preview').style.display = 'none';
        document.getElementById('cameraInput').value = '';
        document.querySelectorAll('.btn-dir').forEach(b => b.classList.remove('active'));
        selectedDirection = "";
        compressedBase64 = null;
        getLocation();
      } else {
        alert("서버 오류: " + result.message);
      }
    } catch (err) {
      alert("전송 중 네트워크 오류가 발생했습니다: " + err.message);
    } finally {
      submitBtn.disabled = false;
      loading.style.display = 'none';
    }
  }
</script>

</body>
</html>
