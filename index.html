<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>도로 순찰 적출 입력</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 14px; background-color: #f4f6f8; color: #202124; }
    .card { background: #fff; padding: 16px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 14px; }
    h2 { margin: 0 0 14px 0; font-size: 1.2rem; text-align: center; color: #1a73e8; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: 600; font-size: 0.88rem; margin-bottom: 5px; color: #3c4043; }
    input[type="text"], select, textarea { width: 100%; padding: 10px; border: 1px solid #dadce0; border-radius: 8px; font-size: 0.95rem; background: #fff; }
    textarea { height: 70px; resize: none; }
    
    /* GPS 박스 */
    .gps-box { display: flex; align-items: center; justify-content: space-between; background: #e8f0fe; padding: 8px 12px; border-radius: 8px; font-size: 0.82rem; }
    .gps-text { color: #1967d2; font-weight: 600; }
    .gps-actions { display: flex; gap: 6px; margin-left: 10px; flex-shrink: 0; }
    .btn-gps { background: #fff; border: 1px solid #1a73e8; color: #1a73e8; padding: 6px 8px; border-radius: 6px; font-size: 0.76rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .btn-gps.manual { background: #1a73e8; color: #fff; }
    
    /* 방향 2버튼 */
    .dir-container { display: flex; gap: 8px; margin-top: 6px; }
    .btn-dir { flex: 1; padding: 12px; font-size: 1rem; font-weight: bold; border: 1px solid #dadce0; border-radius: 8px; background: #f8f9fa; color: #5f6368; cursor: pointer; text-align: center; transition: 0.15s; }
    .btn-dir.active { background: #1a73e8; color: #fff; border-color: #1a73e8; box-shadow: 0 2px 4px rgba(26,115,232,0.3); }

    /* 사진 선택 / 미리보기 */
    .camera-btn { display: block; width: 100%; text-align: center; background: #0f9d58; color: white; padding: 11px; border-radius: 8px; font-weight: bold; font-size: 0.95rem; cursor: pointer; border: 0; }
    #cameraInput, #galleryInput { display: none; }
    .camera-btn:disabled { background: #bdc1c6; cursor: default; }
    .photo-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
    .photo-list:empty { display: none; }
    .photo-item { position: relative; aspect-ratio: 1 / 1; }
    .photo-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; display: block; }
    .photo-remove { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border: 0; border-radius: 50%; background: rgba(0,0,0,0.6); color: #fff; font-size: 0.9rem; font-weight: 700; cursor: pointer; line-height: 26px; padding: 0; }
    .location-source { margin-top: 6px; color: #5f6368; font-size: 0.76rem; }

    /* 사진 촬영/앨범 선택 바텀시트 */
    .sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.38); display: none; align-items: flex-end; justify-content: center; z-index: 1000; padding: 12px; }
    .sheet { width: 100%; max-width: 520px; background: #fff; border-radius: 16px; padding: 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.22); }
    .sheet-title { font-weight: 700; text-align: center; margin: 4px 0 12px; }
    .sheet-btn { width: 100%; border: 1px solid #dadce0; background: #fff; border-radius: 10px; padding: 14px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 8px; }
    .sheet-btn.primary { background: #0f9d58; color: #fff; border-color: #0f9d58; }
    .sheet-btn.secondary { background: #1a73e8; color: #fff; border-color: #1a73e8; }

    /* 지도 선택 모달 */
    .map-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; align-items: center; justify-content: center; z-index: 1100; padding: 12px; }
    .map-panel { width: 100%; max-width: 620px; max-height: 92vh; overflow: auto; background: #fff; border-radius: 14px; padding: 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.25); }
    .map-title { margin: 0 0 6px; font-size: 1.05rem; font-weight: 800; }
    .map-help { color: #5f6368; font-size: 0.84rem; line-height: 1.45; margin-bottom: 10px; }
    #map { width: 100%; height: 52vh; min-height: 320px; border-radius: 10px; background: #eef1f4; overflow: hidden; }
    #mapCoordText { margin-top: 8px; font-size: 0.82rem; color: #1967d2; font-weight: 700; min-height: 20px; }
    .map-actions { display: flex; gap: 8px; margin-top: 10px; }
    .map-actions button { flex: 1; border: 0; padding: 12px 8px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .btn-current { width: 100%; margin-top: 8px; border: 1px solid #1a73e8; color: #1a73e8; background: #fff; padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .btn-map-confirm { background: #1a73e8; color: #fff; }
    .btn-map-cancel { background: #f1f3f4; color: #3c4043; }
    
    /* 버튼 공통 */
    .btn-main { width: 100%; background: #1a73e8; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1.05rem; font-weight: bold; cursor: pointer; }
    .btn-main:disabled { background: #bdc1c6; }
    .btn-share { width: 100%; background: #ea4335; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-bottom: 14px; box-shadow: 0 2px 4px rgba(234,67,53,0.3); }
    .btn-sub { width: 100%; background: #f1f3f4; color: #3c4043; border: 1px solid #dadce0; padding: 12px; border-radius: 8px; font-size: 0.95rem; font-weight: bold; cursor: pointer; margin-top: 14px; }
    
    #loading { display: none; text-align: center; font-weight: bold; color: #d93025; margin-top: 10px; font-size: 0.9rem; }

    /* 완료 화면 요약 카드 */
    .summary-box { background: #f8f9fa; border: 1px solid #dadce0; border-radius: 8px; padding: 14px; font-size: 0.95rem; line-height: 1.6; white-space: pre-wrap; word-break: break-all; margin-bottom: 12px; }
  </style>
</head>
<body>

<!-- 1. 입력 화면 (Input View) -->
<div class="card" id="inputView">
  <h2>도로 순찰 적출 등록</h2>

  <div class="form-group">
    <label for="reporter">보고자</label>
    <input type="text" id="reporter" placeholder="이름 입력" onchange="saveReporter(this.value)">
  </div>

  <div class="form-group">
    <label for="roadSelect">노선명</label>
    <select id="roadSelect" onchange="onRoadChange()">
      <option value="">-- 노선을 선택하세요 --</option>
      <option value="올림픽대로">올림픽대로</option>
      <option value="동부간선도로">동부간선도로</option>
      <option value="동부간선도로B">동부간선도로B</option>
      <option value="강변북로">강변북로</option>
      <option value="내부순환도로">내부순환도로</option>
      <option value="고속국도1호">고속국도1호</option>
      <option value="북부간선도로">북부간선도로</option>
      <option value="국회대로">국회대로</option>
      <option value="언주로">언주로</option>
      <option value="서부간선도로">서부간선도로</option>
      <option value="강남순환로">강남순환로</option>
      <option value="우면산로">우면산로</option>
    </select>
  </div>

  <div class="form-group" id="dirGroup" style="display: none;">
    <label>진행 방향</label>
    <div class="dir-container" id="dirContainer"></div>
  </div>

  <div class="form-group">
    <label for="detailLocation">상세위치</label>
    <input type="text" id="detailLocation" placeholder="예: 3차로 포트홀, OO램프 인근">
  </div>

  <div class="form-group">
    <label>GPS 위치</label>
    <div class="gps-box">
      <span id="gpsStatus" class="gps-text">위치 잡는 중...</span>
      <div class="gps-actions">
        <button type="button" class="btn-gps" onclick="getLocation()">재수신</button>
        <button type="button" class="btn-gps manual" onclick="openMapPicker()">위치 수동선택</button>
      </div>
    </div>
    <div class="location-source" id="locationSource">현재 기기 위치를 확인 중입니다.</div>
  </div>

  <div class="form-group">
    <label for="description">상태설명</label>
    <textarea id="description" placeholder="손상 상태, 도로 시설물 이상 내용 입력"></textarea>
  </div>

  <div class="form-group">
    <label>현장 사진 (최대 5장)</label>
    <button type="button" class="camera-btn" id="addPhotoBtn" onclick="openPhotoSourceSheet()">📷 사진 추가 (0/5)</button>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="processImage(this)">
    <input type="file" id="galleryInput" accept="image/*" multiple onchange="processImage(this)">
    <div id="photoList" class="photo-list"></div>
  </div>

  <button type="button" class="btn-main" id="submitBtn" onclick="submitData()">등록하기</button>
  <div id="loading">데이터 전송 중입니다. 잠시만 기다려주세요...</div>
</div>

<!-- 사진 소스 선택 -->
<div class="sheet-backdrop" id="photoSourceSheet" onclick="handleSheetBackdrop(event)">
  <div class="sheet">
    <div class="sheet-title">사진을 어떻게 추가할까요?</div>
    <button type="button" class="sheet-btn primary" onclick="chooseCamera()">📷 사진 촬영</button>
    <button type="button" class="sheet-btn secondary" onclick="chooseGallery()">🖼️ 앨범에서 선택</button>
    <button type="button" class="sheet-btn" onclick="closePhotoSourceSheet()">취소</button>
  </div>
</div>

<!-- 수동 위치 선택 -->
<div class="map-modal" id="mapModal">
  <div class="map-panel">
    <div class="map-title">지도에서 위치 선택</div>
    <div class="map-help" id="mapHelp">지도를 누르거나 핀을 드래그해 현장 위치를 지정해주세요.</div>
    <div id="map"></div>
    <button type="button" class="btn-current" onclick="moveMapToCurrentLocation()">📍 현재 기기 위치로 이동</button>
    <div id="mapCoordText">지도에서 위치를 선택해주세요.</div>
    <div class="map-actions">
      <button type="button" class="btn-map-cancel" onclick="closeMapPicker()">닫기</button>
      <button type="button" class="btn-map-confirm" onclick="confirmMapLocation()">이 위치 사용</button>
    </div>
  </div>
</div>

<!-- 2. 완료 및 공유 화면 (Result View) -->
<div class="card" id="resultView" style="display: none;">
  <h2>적출 등록 완료</h2>

  <!-- 상단 공유 버튼 -->
  <button type="button" class="btn-share" onclick="shareReport()">📢 밴드 / 카카오톡 공유</button>

  <label>보고 내용 요약</label>
  <div class="summary-box" id="summaryText"></div>
  <div id="summaryPhotos" class="photo-list"></div>
  <button type="button" class="btn-sub" id="downloadPhotoBtn" onclick="downloadPhotos()" style="display: none;">💾 사진 파일로 저장</button>

  <!-- 신규 입력 복귀 버튼 -->
  <button type="button" class="btn-sub" onclick="resetToInput()">➕ 신규 입력 (원래 페이지로)</button>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbywk5Nkz6v_smihkOEMeM39atjJXBJzkG8Afz5m9VaiXBmBQ184ixio3Pv_sDFOJmcm/exec";

  // Kakao Developers에서 발급한 JavaScript 키를 입력하세요.
  // 운영 시에는 반드시 실제 서비스 도메인만 허용하도록 플랫폼(Web) 도메인을 등록하세요.
  const KAKAO_MAP_APP_KEY = "5cdafd778090db58369a5ff63f278a1a";

  const ROAD_DIRECTIONS = {
    "올림픽대로": ["공항", "강일"],
    "동부간선도로": ["의정부", "성수"],
    "동부간선도로B": ["장지", "청담"],
    "강변북로": ["난지", "구리"],
    "내부순환도로": ["성산", "성수"],
    "고속국도1호": ["서울", "부산"],
    "북부간선도로": ["월곡", "신내"],
    "국회대로": ["목동", "인천"],
    "언주로": ["포이", "내곡"],
    "서부간선도로": ["성산", "시흥"],
    "강남순환로": ["광명", "수서"],
    "우면산로": ["반포", "과천"]
  };

  let selectedDirection = "";
  let currentLat = null;
  let currentLng = null;
  const MAX_PHOTOS = 5;
  // 첨부 사진 목록: { base64: 서버 전송용, blob: 공유/저장용 }
  let photos = [];
  let photoProcessing = 0; // 압축 중인 사진 수
  let photoGpsAsked = false; // 이번 보고에서 사진 좌표 적용을 이미 물었는지
  let exifrPromise = null;
  let locationSource = "device";

  let kakaoSdkPromise = null;
  let kakaoMap = null;
  let kakaoMarker = null;
  let pendingMapLat = null;
  let pendingMapLng = null;

  // 공유용 텍스트 캐시
  let lastReportText = "";
  // PC 공유용 텍스트 (사진 단축 링크 포함)
  let pcShareText = "";

  window.onload = function() {
    const savedName = localStorage.getItem('reporterName');
    if (savedName) document.getElementById('reporter').value = savedName;
    getLocation(false);
  };

  function saveReporter(name) {
    localStorage.setItem('reporterName', name);
  }

  function onRoadChange() {
    const road = document.getElementById('roadSelect').value;
    const dirGroup = document.getElementById('dirGroup');
    const container = document.getElementById('dirContainer');
    
    selectedDirection = "";
    container.innerHTML = "";

    if (!road || !ROAD_DIRECTIONS[road]) {
      dirGroup.style.display = "none";
      return;
    }

    ROAD_DIRECTIONS[road].forEach(dir => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn-dir';
      btn.innerText = `${dir} 방향`;
      btn.onclick = function() {
        document.querySelectorAll('.btn-dir').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedDirection = dir;
      };
      container.appendChild(btn);
    });

    dirGroup.style.display = "block";
  }

  function setLocation(lat, lng, source, label) {
    currentLat = Number(lat).toFixed(6);
    currentLng = Number(lng).toFixed(6);
    locationSource = source;

    document.getElementById('gpsStatus').innerText = `수신완료 (${currentLat}, ${currentLng})`;
    document.getElementById('locationSource').innerText = label;
  }

  function getLocation(force = true) {
    const statusText = document.getElementById('gpsStatus');
    const sourceText = document.getElementById('locationSource');
    statusText.innerText = "위치 갱신 중...";
    sourceText.innerText = "현재 기기 GPS를 확인 중입니다.";

    if (!navigator.geolocation) {
      statusText.innerText = "GPS 미지원";
      sourceText.innerText = "위치 수동선택을 눌러 지도에서 현장 위치를 지정해주세요.";
      return;
    }

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        // 페이지 진입 직후 시작된 위치 요청이 사용자의 수동 선택을 뒤늦게 덮어쓰지 않도록 한다.
        if (!force && locationSource !== "device") return;

        setLocation(
          pos.coords.latitude,
          pos.coords.longitude,
          "device",
          `현재 기기 GPS · 정확도 약 ${Math.round(pos.coords.accuracy)}m`
        );
      },
      (err) => {
        statusText.innerText = "GPS 수신 실패";
        if (err && err.code === 1) {
          sourceText.innerText = "위치 권한이 허용되지 않았습니다. 권한을 허용한 뒤 재수신하거나 위치 수동선택을 사용해주세요.";
        } else {
          sourceText.innerText = "현재 위치를 가져오지 못했습니다. 재수신하거나 위치 수동선택을 사용해주세요.";
        }
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  }

  function openPhotoSourceSheet() {
    if (photos.length + photoProcessing >= MAX_PHOTOS) {
      alert(`사진은 최대 ${MAX_PHOTOS}장까지 추가할 수 있습니다.`);
      return;
    }
    document.getElementById('photoSourceSheet').style.display = 'flex';
  }

  function closePhotoSourceSheet() {
    document.getElementById('photoSourceSheet').style.display = 'none';
  }

  function handleSheetBackdrop(event) {
    if (event.target.id === 'photoSourceSheet') closePhotoSourceSheet();
  }

  function chooseCamera() {
    closePhotoSourceSheet();
    const input = document.getElementById('cameraInput');
    input.value = '';
    input.click();
  }

  function chooseGallery() {
    closePhotoSourceSheet();
    const input = document.getElementById('galleryInput');
    input.value = '';
    input.click();
  }

  function isImageFile(file) {
    if (!file) return false;
    if (file.type && file.type.startsWith('image/')) return true;
    return /\.(jpe?g|png|heic|heif|webp)$/i.test(file.name || '');
  }

  async function processImage(input) {
    if (!input.files || !input.files.length) return;

    let files = Array.from(input.files);
    input.value = '';
    closePhotoSourceSheet();

    if (files.some(f => !isImageFile(f))) {
      alert('사진 파일만 선택할 수 있습니다. 사진이 아닌 파일은 제외합니다.');
      files = files.filter(isImageFile);
    }

    const remaining = MAX_PHOTOS - photos.length - photoProcessing;
    if (files.length > remaining) {
      alert(`사진은 최대 ${MAX_PHOTOS}장까지입니다. 앞의 ${Math.max(remaining, 0)}장만 추가합니다.`);
      files = files.slice(0, Math.max(remaining, 0));
    }
    if (!files.length) return;

    photoProcessing += files.length;
    updatePhotoButton();

    // 선택한 순서대로 추가되도록 하나씩 처리한다.
    for (const file of files) {
      try {
        // 압축하면 EXIF가 사라지므로 원본 파일에서 먼저 좌표를 확인한다.
        if (!photoGpsAsked && !isMobileDevice()) {
          await tryUsePhotoLocation(file);
        }
        photos.push(await compressImage(file));
      } catch (err) {
        alert(err.message);
      } finally {
        photoProcessing--;
        renderPhotoList();
      }
    }
  }

  // PC 전용: 사진 EXIF의 GPS 좌표를 읽어 위치로 쓸지 묻는다.
  // 안드로이드는 사진 선택 시 좌표가 지워지는 경우가 많고, 현장에서는 기기 GPS가 정확하므로 제외한다.
  // 좌표가 있는 첫 사진에서 한 번만 묻는다(평균은 서로 다른 곳에서 찍은 사진이 섞이면 엉뚱한 위치가 됨).
  function loadExifr() {
    if (window.exifr) return Promise.resolve();
    if (exifrPromise) return exifrPromise;
    exifrPromise = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = "https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js";
      script.onload = () => window.exifr ? resolve() : reject(new Error("exifr 초기화 실패"));
      script.onerror = () => { exifrPromise = null; reject(new Error("exifr를 불러오지 못했습니다.")); };
      document.head.appendChild(script);
    });
    return exifrPromise;
  }

  async function tryUsePhotoLocation(file) {
    let gps = null;
    try {
      await loadExifr();
      gps = await exifr.gps(file);
    } catch (err) {
      console.warn("사진 좌표 읽기 실패:", err);
      return;
    }
    if (!gps || !isFinite(gps.latitude) || !isFinite(gps.longitude)
        || (gps.latitude === 0 && gps.longitude === 0)) {
      return; // 좌표 없는 사진은 조용히 넘어간다.
    }

    photoGpsAsked = true;
    const lat = Number(gps.latitude).toFixed(6);
    const lng = Number(gps.longitude).toFixed(6);
    const overwriteNote = locationSource === "map" ? "\n\n※ 지도에서 직접 고른 위치를 덮어씁니다." : "";
    if (confirm(`사진에 기록된 위치로 GPS를 설정할까요?\n(${lat}, ${lng})${overwriteNote}`)) {
      setLocation(gps.latitude, gps.longitude, "photo", "사진에 기록된 위치입니다.");
    }
  }

  // 사진은 업로드/미리보기용으로 압축한다. (압축본에는 EXIF/좌표가 남지 않는다)
  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error("사진 파일을 읽지 못했습니다."));
      reader.onload = function(e) {
        const img = new Image();

        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 1200;
          let width = img.width;
          let height = img.height;

          if (width > height && width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const base64 = canvas.toDataURL('image/jpeg', 0.75);
          canvas.toBlob(function(blob) {
            if (!blob) {
              reject(new Error("사진 변환에 실패했습니다."));
              return;
            }
            resolve({ base64, blob });
          }, 'image/jpeg', 0.75);
        };

        img.onerror = function() {
          reject(new Error("선택한 사진을 브라우저에서 열 수 없습니다. 다른 사진 형식으로 다시 시도해주세요."));
        };

        img.src = e.target.result;
      };

      reader.readAsDataURL(file);
    });
  }

  function updatePhotoButton() {
    const btn = document.getElementById('addPhotoBtn');
    const count = photos.length + photoProcessing;
    btn.innerText = photoProcessing > 0
      ? `사진 처리 중... (${count}/${MAX_PHOTOS})`
      : `📷 사진 추가 (${count}/${MAX_PHOTOS})`;
    btn.disabled = count >= MAX_PHOTOS;
  }

  // 썸네일 목록 그리기. removable=false면 삭제 버튼 없이 보여주기만 한다.
  function renderPhotoGrid(containerId, removable) {
    const list = document.getElementById(containerId);
    list.innerHTML = '';
    photos.forEach((photo, idx) => {
      const item = document.createElement('div');
      item.className = 'photo-item';

      const img = document.createElement('img');
      img.src = photo.base64;
      img.alt = `사진 ${idx + 1}`;
      item.appendChild(img);

      if (removable) {
        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'photo-remove';
        del.innerText = '✕';
        del.onclick = () => removePhoto(idx);
        item.appendChild(del);
      }
      list.appendChild(item);
    });
  }

  function renderPhotoList() {
    renderPhotoGrid('photoList', true);
    updatePhotoButton();
  }

  function removePhoto(idx) {
    photos.splice(idx, 1);
    renderPhotoList();
  }

  function loadKakaoMapSdk() {
    if (window.kakao && window.kakao.maps) return Promise.resolve();
    if (kakaoSdkPromise) return kakaoSdkPromise;

    if (!KAKAO_MAP_APP_KEY || KAKAO_MAP_APP_KEY === "YOUR_KAKAO_JAVASCRIPT_KEY") {
      return Promise.reject(new Error("Kakao JavaScript 키가 설정되지 않았습니다."));
    }

    kakaoSdkPromise = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.id = 'kakaoMapSdk';
      script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(KAKAO_MAP_APP_KEY)}&autoload=false`;
      script.onload = () => {
        if (!window.kakao || !window.kakao.maps) {
          reject(new Error("Kakao 지도 SDK 초기화에 실패했습니다."));
          return;
        }
        kakao.maps.load(resolve);
      };
      script.onerror = () => reject(new Error("Kakao 지도 SDK를 불러오지 못했습니다."));
      document.head.appendChild(script);
    });

    return kakaoSdkPromise;
  }

  async function openMapPicker(message) {
    const modal = document.getElementById('mapModal');
    const help = document.getElementById('mapHelp');
    const coordText = document.getElementById('mapCoordText');

    help.innerText = message || "지도를 누르거나 핀을 드래그해 현장 위치를 지정해주세요.";
    coordText.innerText = "지도를 불러오는 중...";
    modal.style.display = 'flex';

    try {
      await loadKakaoMapSdk();
      initOrRefreshMap();
    } catch (err) {
      document.getElementById('map').innerHTML = `
        <div style="height:100%;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;color:#5f6368;line-height:1.5;">
          ${err.message}<br>KAKAO_MAP_APP_KEY를 입력하고 Kakao Developers에 서비스 도메인을 등록해주세요.
        </div>`;
      coordText.innerText = "지도 API 설정이 필요합니다.";
    }
  }

  function initOrRefreshMap() {
    const mapContainer = document.getElementById('map');
    mapContainer.innerHTML = '';

    const fallbackLat = 37.566500;
    const fallbackLng = 126.978000;
    const centerLat = currentLat ? Number(currentLat) : fallbackLat;
    const centerLng = currentLng ? Number(currentLng) : fallbackLng;
    const center = new kakao.maps.LatLng(centerLat, centerLng);

    kakaoMap = new kakao.maps.Map(mapContainer, {
      center,
      level: 4
    });

    kakaoMarker = new kakao.maps.Marker({
      position: center,
      draggable: true
    });

    if (currentLat && currentLng) {
      kakaoMarker.setMap(kakaoMap);
      pendingMapLat = Number(currentLat);
      pendingMapLng = Number(currentLng);
      updateMapCoordText();
    } else {
      pendingMapLat = null;
      pendingMapLng = null;
      document.getElementById('mapCoordText').innerText = "지도를 누르거나 핀을 드래그해 위치를 지정해주세요.";
    }

    kakao.maps.event.addListener(kakaoMap, 'click', function(mouseEvent) {
      const latlng = mouseEvent.latLng;
      pendingMapLat = latlng.getLat();
      pendingMapLng = latlng.getLng();
      kakaoMarker.setPosition(latlng);
      kakaoMarker.setMap(kakaoMap);
      updateMapCoordText();
    });

    kakao.maps.event.addListener(kakaoMarker, 'dragend', function() {
      const latlng = kakaoMarker.getPosition();
      pendingMapLat = latlng.getLat();
      pendingMapLng = latlng.getLng();
      updateMapCoordText();
    });

    setTimeout(() => kakaoMap.relayout(), 50);
  }

  function updateMapCoordText() {
    if (pendingMapLat == null || pendingMapLng == null) return;
    document.getElementById('mapCoordText').innerText =
      `선택 위치: ${pendingMapLat.toFixed(6)}, ${pendingMapLng.toFixed(6)}`;
  }

  function moveMapToCurrentLocation() {
    if (!navigator.geolocation) {
      alert("이 브라우저에서는 현재 위치를 사용할 수 없습니다.");
      return;
    }

    const coordText = document.getElementById('mapCoordText');
    coordText.innerText = "현재 위치를 확인 중...";

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        pendingMapLat = pos.coords.latitude;
        pendingMapLng = pos.coords.longitude;
        updateMapCoordText();

        if (kakaoMap && kakaoMarker) {
          const latlng = new kakao.maps.LatLng(pendingMapLat, pendingMapLng);
          kakaoMap.setCenter(latlng);
          kakaoMarker.setPosition(latlng);
          kakaoMarker.setMap(kakaoMap);
        }
      },
      () => {
        coordText.innerText = "현재 위치 수신에 실패했습니다. 지도를 눌러 직접 선택해주세요.";
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  }

  function confirmMapLocation() {
    if (pendingMapLat == null || pendingMapLng == null) {
      alert("지도에서 위치를 먼저 선택해주세요.");
      return;
    }

    setLocation(pendingMapLat, pendingMapLng, "map", "지도에서 직접 지정한 위치입니다.");
    closeMapPicker();
  }

  function closeMapPicker() {
    document.getElementById('mapModal').style.display = 'none';
  }

  // 데이터 전송 및 완료 화면 전환
  async function submitData() {
    const reporter = document.getElementById('reporter').value.trim();
    const road = document.getElementById('roadSelect').value;
    const detail = document.getElementById('detailLocation').value.trim();
    const desc = document.getElementById('description').value.trim();
    const submitBtn = document.getElementById('submitBtn');
    const loading = document.getElementById('loading');

    if (!road) {
      alert("노선명을 선택해주세요.");
      return;
    }
    if (!selectedDirection) {
      alert("방향을 선택해주세요.");
      return;
    }

    if (!currentLat || !currentLng) {
      alert("GPS 위치가 지정되지 않았습니다. 재수신하거나 위치 수동선택을 사용해주세요.");
      return;
    }

    if (photoProcessing > 0) {
      alert("사진을 처리하는 중입니다. 잠시 후 다시 눌러주세요.");
      return;
    }

    submitBtn.disabled = true;
    loading.style.display = 'block';

    const payload = {
      reporter: reporter,
      roadName: road,
      direction: selectedDirection,
      detailLocation: detail,
      latitude: currentLat,
      longitude: currentLng,
      description: desc,
      images: photos.map(p => p.base64)
    };

    try {
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (result.status === "success") {
        // 공유 텍스트 작성
        // 형식:
        // [노선명 방향 상세위치]
        // [상태설명]
        // [카카오맵 링크]
        let kakaoMapUrl = "";
        if (currentLat && currentLng) {
          // 형식: /link/map/핀이름,위도,경도
          // 밴드가 쉼표에서 URL을 끊으므로 쉼표까지 전부 %2C로 인코딩한다(카카오맵은 정상 인식).
          // 핀이름 안의 쉼표는 구분자와 헷갈리지 않도록 공백으로 바꾼다.
          const pinName = `${road} ${selectedDirection}방향 ${detail}`.replace(/,/g, ' ').replace(/\s+/g, ' ').trim();
          kakaoMapUrl = "https://map.kakao.com/link/map/" + encodeURIComponent(`${pinName},${currentLat},${currentLng}`);
        }

        lastReportText = `${road} ${selectedDirection}방향 ${detail}\n${desc}`;
        if (kakaoMapUrl) {
          lastReportText += `\n\n위치확인(카카오맵):\n${kakaoMapUrl}`;
        }

        // PC는 사진 파일을 넘길 수 없으므로 서버가 돌려준 사진 링크를 글에 붙인다.
        // photoUrl(단일)은 이전 버전 서버 응답 호환용
        const photoUrls = Array.isArray(result.photoUrls) ? result.photoUrls
          : (result.photoUrl ? [result.photoUrl] : []);
        pcShareText = lastReportText;
        if (photoUrls.length) {
          pcShareText += `\n\n사진보기:\n${photoUrls.join('\n')}`;
        }

        // 결과 화면 표시 세팅
        document.getElementById('summaryText').innerText = isMobileDevice() ? lastReportText : pcShareText;
        renderPhotoGrid('summaryPhotos', false);
        document.getElementById('downloadPhotoBtn').style.display =
          (photos.length && photoUrls.length < photos.length && !isMobileDevice()) ? 'block' : 'none';

        // 화면 전환: 입력 화면 숨기고 결과 화면 오픈
        document.getElementById('inputView').style.display = 'none';
        document.getElementById('resultView').style.display = 'block';
        window.scrollTo(0, 0);

      } else {
        alert("서버 오류: " + result.message);
      }
    } catch (err) {
      alert("전송 중 네트워크 오류: " + err.message);
    } finally {
      submitBtn.disabled = false;
      loading.style.display = 'none';
    }
  }

  function isMobileDevice() {
    if (navigator.userAgentData && typeof navigator.userAgentData.mobile === 'boolean') {
      return navigator.userAgentData.mobile;
    }
    return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  }

  // PC: 밴드 웹 공유창을 텍스트와 함께 연다.
  // 밴드 공유 URL은 텍스트만 받으므로 사진은 글 안의 드라이브 단축 링크로 전달한다.
  function shareToBandPC() {
    const shareUrl = "https://band.us/plugin/share"
      + "?body=" + encodeURIComponent(pcShareText)
      + "&route=" + encodeURIComponent(location.origin && location.origin !== "null" ? location.origin : "https://band.us");

    const popup = window.open(shareUrl, "bandShare", "width=520,height=720");
    if (!popup) {
      // 팝업 차단 시 현재 탭에서 연다.
      location.href = shareUrl;
    }
  }

  // 사진 링크를 못 받았을 때(서버 미반영 등) 사진을 직접 첨부할 수 있게 파일로 저장
  function downloadPhotos() {
    photos.forEach((photo, idx) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(photo.blob);
      a.download = `patrol_photo_${idx + 1}.jpg`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });
  }

  // 모바일: 시스템 네이티브 공유창 호출 (카카오톡, 밴드 등으로 전송)
  // PC: 밴드 웹 공유창
  async function shareReport() {
    if (!isMobileDevice() || !navigator.share) {
      shareToBandPC();
      return;
    }

    const shareData = {
      text: lastReportText
    };

    // 사진이 있으면 전부 파일로 함께 포함
    if (photos.length) {
      const files = photos.map((p, idx) =>
        new File([p.blob], `patrol_photo_${idx + 1}.jpg`, { type: "image/jpeg" }));
      if (navigator.canShare && navigator.canShare({ files })) {
        shareData.files = files;
      }
    }

    try {
      await navigator.share(shareData);
    } catch (err) {
      if (err.name !== 'AbortError') {
        alert("공유 실패: " + err.message);
      }
    }
  }

  // 신규 입력으로 돌아가기
  function resetToInput() {
    // 폼 초기화 (보고자와 노선명은 편의상 유지)
    document.getElementById('detailLocation').value = '';
    document.getElementById('description').value = '';
    document.getElementById('cameraInput').value = '';
    document.getElementById('galleryInput').value = '';
    document.querySelectorAll('.btn-dir').forEach(b => b.classList.remove('active'));
    selectedDirection = "";
    photos = [];
    photoGpsAsked = false;
    renderPhotoList();
    document.getElementById('summaryPhotos').innerHTML = '';
    pcShareText = "";
    lastReportText = "";
    locationSource = "device";
    pendingMapLat = null;
    pendingMapLng = null;

    // 화면 전환
    document.getElementById('resultView').style.display = 'none';
    document.getElementById('inputView').style.display = 'block';
    window.scrollTo(0, 0);

    getLocation(false); // 새 입력 시작 시 현재 위치 재수신
  }
</script>
